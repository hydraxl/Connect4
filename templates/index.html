<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect 4</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div id="difficulty-screen" class="difficulty-screen">
            <h1>Connect 4</h1>
            <p class="difficulty-subtitle">Choose your opponent's strength</p>
            <div class="difficulty-form">
                <label for="depth-select">Recursion Depth:</label>
                <select id="depth-select" class="depth-select">
                    <option value="2">2 - Easy</option>
                    <option value="4">4 - Medium</option>
                    <option value="6" selected>6 - Hard</option>
                    <option value="8">8 - Expert</option>
                    <option value="10">10 - Master</option>
                </select>
                <p class="depth-hint">Higher depth = stronger bot, slower moves</p>
                <button id="start-game-btn" class="btn btn-primary">Start Game</button>
            </div>
        </div>
        
        <div id="game-screen" class="game-screen" style="display: none;">
        <h1>Connect 4</h1>
        
        <div class="game-info">
            <div class="status" id="status">Player 1's Turn (Red)</div>
            <button id="new-game-btn" class="btn">New Game</button>
        </div>
        
        <div class="board-container">
            <div class="board" id="board">
                <!-- Board will be generated by JavaScript -->
            </div>
        </div>
        
        <div class="instructions">
            <p>Click on a column to drop your piece. Get 4 in a row to win!</p>
        </div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
